<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="plasmaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1793d1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#5277c3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d2d;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- KDE Plasma stylized logo -->
  <rect x="10" y="15" width="100" height="90" rx="15" fill="url(#plasmaGradient)"/>
  <!-- Plasma "P" symbol -->
  <path d="M40 90 L40 30 A20 20 0 0 1 80 30 L80 50 A12 12 0 0 0 52 50 L52 70" fill="none" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Plasma dots -->
  <circle cx="90" cy="40" r="4" fill="white" opacity="0.8"/>
  <circle cx="30" cy="70" r="3" fill="white" opacity="0.6"/>
  <circle cx="95" cy="80" r="2" fill="white" opacity="0.5"/>
</svg>