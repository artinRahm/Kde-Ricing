<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2e3440;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b4252;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent7" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#81a1c1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#88c0d0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg7)"/>
  <!-- Custom Nord variant - slightly different blues -->
  <rect x="40" y="40" width="360" height="200" rx="6" fill="#3b4252" stroke="#81a1c1" stroke-width="2"/>
  <rect x="400" y="40" width="360" height="200" rx="6" fill="#3b4252" stroke="#88c0d0" stroke-width="2"/>
  <rect x="40" y="260" width="360" height="200" rx="6" fill="#3b4252" stroke="#8fbcbb" stroke-width="2"/>
  <rect x="400" y="260" width="360" height="200" rx="6" fill="#3b4252" stroke="#a3be8c" stroke-width="2"/>
  <!-- Custom color indicators -->
  <rect x="60" y="60" width="100" height="30" rx="4" fill="#5e81ac"/>
  <text x="110" y="82" font-family="sans-serif" font-size="11" fill="#eceff4" text-anchor="middle">Nord Base</text>
  <rect x="180" y="60" width="100" height="30" rx="4" fill="#81a1c1"/>
  <text x="230" y="82" font-family="sans-serif" font-size="11" fill="#eceff4" text-anchor="middle">Nord Light</text>
  <rect x="420" y="60" width="100" height="30" rx="4" fill="#88c0d0"/>
  <text x="470" y="82" font-family="sans-serif" font-size="11" fill="#eceff4" text-anchor="middle">Nord Cyan</text>
  <rect x="540" y="60" width="100" height="30" rx="4" fill="#8fbcbb"/>
  <text x="590" y="82" font-family="sans-serif" font-size="11" fill="#eceff4" text-anchor="middle">Nord Green</text>
  <!-- Krohnkite indicator -->
  <text x="400" y="150" font-family="monospace" font-size="16" fill="#81a1c1" text-anchor="middle">Krohnkite Tiling Active</text>
  <text x="400" y="180" font-family="monospace" font-size="12" fill="#4c566a" text-anchor="middle">Meta+Enter • Meta+H/J/K/L • Meta+Shift+Q</text>
  <text x="400" y="480" font-family="sans-serif" font-size="18" font-weight="bold" fill="#eceff4" text-anchor="middle">Custom Nord Build — Arch Linux</text>
</svg>