<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d353b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#343f44;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent8" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a7c080;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7fbbb3;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg8)"/>
  <!-- Everforest theme -->
  <rect x="100" y="80" width="600" height="320" rx="8" fill="#343f44" stroke="#a7c080" stroke-width="2"/>
  <rect x="100" y="80" width="600" height="36" rx="8" fill="#435047"/>
  <circle cx="120" cy="98" r="6" fill="#e67e80"/>
  <circle cx="140" cy="98" r="6" fill="#dbbc7f"/>
  <circle cx="160" cy="98" r="6" fill="#a7c080"/>
  <!-- Latte Dock -->
  <rect x="150" y="420" width="500" height="60" rx="30" fill="#2d353b" opacity="0.9"/>
  <rect x="170" y="430" width="460" height="40" rx="20" fill="#343f44"/>
  <!-- Config snippet -->
  <text x="130" y="150" font-family="monospace" font-size="13" fill="#d3c6aa"># Everforest NixOS Config</text>
  <text x="130" y="180" font-family="monospace" font-size="13" fill="#a7c080">{ pkgs, ... }:</text>
  <text x="150" y="210" font-family="monospace" font-size="13" fill="#d3c6aa">{</text>
  <text x="170" y="240" font-family="monospace" font-size="13" fill="#7fbbb3">environment.systemPackages = with pkgs; [</text>
  <text x="190" y="270" font-family="monospace" font-size="13" fill="#dbbc7f">kdePackages.plasma-browser-integration</text>
  <text x="190" y="300" font-family="monospace" font-size="13" fill="#dbbc7f">kdePackages.kvantum</text>
  <text x="190" y="330" font-family="monospace" font-size="13" fill="#dbbc7f">kdePackages.latte-dock</text>
  <text x="170" y="360" font-family="monospace" font-size="13" fill="#7fbbb3">];</text>
  <text x="150" y="390" font-family="monospace" font-size="13" fill="#d3c6aa">}</text>
  <text x="400" y="480" font-family="sans-serif" font-size="18" font-weight="bold" fill="#d3c6aa" text-anchor="middle">Everforest NixOS — Declarative</text>
</svg>