<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#313244;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#cba6f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5c2e7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg2)"/>
  <!-- Tiled windows -->
  <rect x="40" y="40" width="360" height="220" rx="6" fill="#313244" stroke="#cba6f7" stroke-width="2"/>
  <rect x="400" y="40" width="360" height="220" rx="6" fill="#313244" stroke="#f5c2e7" stroke-width="2"/>
  <rect x="40" y="280" width="360" height="180" rx="6" fill="#313244" stroke="#fab387" stroke-width="2"/>
  <rect x="400" y="280" width="360" height="180" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <!-- Terminal bars -->
  <rect x="50" y="50" width="340" height="28" rx="4" fill="#1e1e2e"/>
  <circle cx="70" cy="64" r="5" fill="#f38ba8"/>
  <circle cx="88" cy="64" r="5" fill="#fab387"/>
  <circle cx="106" cy="64" r="5" fill="#a6e3a1"/>
  <rect x="410" y="50" width="340" height="28" rx="4" fill="#1e1e2e"/>
  <circle cx="430" cy="64" r="5" fill="#f38ba8"/>
  <circle cx="448" cy="64" r="5" fill="#fab387"/>
  <circle cx="466" cy="64" r="5" fill="#a6e3a1"/>
  <!-- Code in windows -->
  <text x="70" y="100" font-family="monospace" font-size="12" fill="#cdd6f4">fn main() {</text>
  <text x="70" y="125" font-family="monospace" font-size="12" fill="#cba6f7">    println!</text>
  <text x="90" y="125" font-family="monospace" font-size="12" fill="#f9e2af">("Hello"</text>
  <text x="150" y="125" font-family="monospace" font-size="12" fill="#f5c2e7">NixOS!"</text>
  <text x="220" y="125" font-family="monospace" font-size="12" fill="#f9e2af">);</text>
  <text x="70" y="150" font-family="monospace" font-size="12" fill="#cdd6f4">}</text>
  <!-- NixOS logo small -->
  <rect x="600" y="300" width="80" height="80" rx="10" fill="#5277c3"/>
  <path d="M640 320 L640 360 M620 340 L660 340" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <text x="400" y="480" font-family="sans-serif" font-size="18" font-weight="bold" fill="#cdd6f4" text-anchor="middle">Catppuccin Tiling — NixOS</text>
</svg>