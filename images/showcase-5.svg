<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#282a36;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#44475a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#bd93f9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff79c6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg5)"/>
  <!-- Hidden panel, only KRunner -->
  <rect x="200" y="150" width="400" height="80" rx="20" fill="#44475a" opacity="0.95" stroke="#bd93f9" stroke-width="2"/>
  <text x="400" y="195" font-family="sans-serif" font-size="20" fill="#f8f8f2" text-anchor="middle">🔍 Type to search...</text>
  <text x="400" y="230" font-family="monospace" font-size="12" fill="#6272a4" text-anchor="middle">Alt+Space • Dracula Theme</text>
  <!-- Background wallpaper hint -->
  <rect x="100" y="100" width="600" height="300" rx="8" fill="#282a36" stroke="#bd93f9" stroke-width="1" stroke-dasharray="10,5"/>
  <text x="400" y="280" font-family="sans-serif" font-size="16" fill="#6272a4" text-anchor="middle">Minimal Desktop • Wallpaper: Dracula</text>
  <text x="400" y="310" font-family="monospace" font-size="12" fill="#6272a4" text-anchor="middle">Meta+D → KRunner | Meta+Enter → Terminal</text>
  <text x="400" y="480" font-family="sans-serif" font-size="18" font-weight="bold" fill="#f8f8f2" text-anchor="middle">Dracula Minimal — Arch Linux</text>
</svg>