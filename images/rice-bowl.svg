<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="riceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e67e22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d35400;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bowlGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ecf0f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bdc3c7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Bowl -->
  <path d="M30 85 Q30 100 90 100 Q90 85 90 60 Q90 35 60 35 Q30 35 30 60 Z" fill="url(#bowlGradient)" stroke="#95a5a6" stroke-width="2"/>
  <!-- Bowl rim -->
  <ellipse cx="60" cy="35" rx="30" ry="5" fill="none" stroke="#ecf0f1" stroke-width="3"/>
  <!-- Rice grains -->
  <g fill="url(#riceGradient)">
    <ellipse cx="45" cy="55" rx="4" ry="6" transform="rotate(-15 45 55)"/>
    <ellipse cx="55" cy="50" rx="3.5" ry="5.5" transform="rotate(10 55 50)"/>
    <ellipse cx="65" cy="52" rx="4" ry="6" transform="rotate(-5 65 52)"/>
    <ellipse cx="75" cy="58" rx="3.5" ry="5.5" transform="rotate(15 75 58)"/>
    <ellipse cx="50" cy="65" rx="4" ry="6" transform="rotate(5 50 65)"/>
    <ellipse cx="60" cy="70" rx="3.5" ry="5.5" transform="rotate(-10 60 70)"/>
    <ellipse cx="70" cy="68" rx="4" ry="6" transform="rotate(8 70 68)"/>
    <ellipse cx="48" cy="78" rx="3.5" ry="5.5" transform="rotate(-8 48 78)"/>
    <ellipse cx="62" cy="80" rx="4" ry="6" transform="rotate(12 62 80)"/>
    <ellipse cx="72" cy="75" rx="3.5" ry="5.5" transform="rotate(-3 72 75)"/>
  </g>
  <!-- Steam lines -->
  <g stroke="#ecf0f1" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <path d="M50 35 Q45 25 50 15"/>
    <path d="M60 35 Q60 20 60 10"/>
    <path d="M70 35 Q75 25 70 15"/>
  </g>
  <!-- Chopsticks -->
  <g stroke="#8b4513" stroke-width="3" stroke-linecap="round">
    <path d="M85 40 Q95 30 105 15"/>
    <path d="M90 45 Q100 35 110 20"/>
  </g>
</svg>